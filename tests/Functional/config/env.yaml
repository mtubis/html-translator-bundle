# Scenario fixture: every key that may come from env is an %env()% placeholder (ADR-0004). None of the variables is
# set when the container is compiled, so this boots only if nothing is resolved at compile time.
html_translator:
    default_provider: together
    providers:
        together:
            driver: openai_compatible
            name: '%env(HTML_TRANSLATOR_TEST_NAME)%'
            base_url: '%env(HTML_TRANSLATOR_TEST_BASE_URL)%'
            api_key: '%env(HTML_TRANSLATOR_TEST_API_KEY)%'
            model: '%env(HTML_TRANSLATOR_TEST_MODEL)%'
            extra_headers:
                X-Gateway-Token: '%env(HTML_TRANSLATOR_TEST_HEADER)%'
    http:
        timeout: '%env(float:HTML_TRANSLATOR_TEST_TIMEOUT)%'

# Test-only consumer: the container dumper rejects env variables no definition or parameter uses, and the bundle
# registers no services from these entries yet. Remove it once the provider services (issue #3) consume them.
parameters:
    html_translator_test.env_consumer:
        - '%env(HTML_TRANSLATOR_TEST_NAME)%'
        - '%env(HTML_TRANSLATOR_TEST_BASE_URL)%'
        - '%env(HTML_TRANSLATOR_TEST_API_KEY)%'
        - '%env(HTML_TRANSLATOR_TEST_MODEL)%'
        - '%env(HTML_TRANSLATOR_TEST_HEADER)%'
        - '%env(float:HTML_TRANSLATOR_TEST_TIMEOUT)%'
