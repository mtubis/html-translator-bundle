# Scenario fixture for the console commands: a working and a corrupting provider, no unit cache (every run reaches
# the provider).
html_translator:
    default_provider: pseudo
    cache:
        enabled: false
    providers:
        pseudo:
            driver: pseudo
        broken:
            driver: pseudo
            corrupt_every: 1
            corrupt_retries: true
    profiles:
        docs:
            preset: technical
