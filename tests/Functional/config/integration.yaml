# Scenario fixture for tests/Integration: real APIs, keys and models from env (see .env.dist).
html_translator:
    # Every translation must reach the HTTP client; the unit cache would answer repeated ones.
    cache:
        enabled: false
    default_provider: openai
    providers:
        openai:
            driver: openai
            api_key: '%env(OPENAI_API_KEY)%'
            model: '%env(HTML_TRANSLATOR_OPENAI_MODEL)%'
        anthropic:
            driver: anthropic
            api_key: '%env(ANTHROPIC_API_KEY)%'
            model: '%env(HTML_TRANSLATOR_ANTHROPIC_MODEL)%'
        gemini:
            driver: gemini
            api_key: '%env(GEMINI_API_KEY)%'
            model: '%env(HTML_TRANSLATOR_GEMINI_MODEL)%'
