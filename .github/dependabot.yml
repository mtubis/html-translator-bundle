version: 2

updates:
  # Actions are pinned to commit SHAs; Dependabot bumps the SHA and the version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Give the community time to spot a compromised release before it reaches CI.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  # A library has no committed lock file: only widen a constraint in composer.json when a release falls outside it.
  # The Symfony constraint (^7.4 || ^8.1) is set by ADR-0005 and the core constraint by ADR-0002; review such PRs
  # against them.
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
    cooldown:
      default-days: 7
      semver-major-days: 30
    commit-message:
      prefix: build
